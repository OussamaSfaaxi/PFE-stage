services:

  # ── Base de données MySQL ─────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: evoprint-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pfeprojet
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend Node.js ───────────────────────────────────────────
  backend:
    build: ./back
    container_name: evoprint-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./back/.env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: pfeprojet
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  # ── Frontend React (Nginx) ────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: evoprint-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db_data:
  uploads_data:
